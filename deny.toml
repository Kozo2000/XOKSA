# cargo-deny — supply-chain gate for the shipped binary.
#   cargo deny check                                        # native workspace
#   cargo deny --manifest-path webui-leptos/Cargo.toml --config deny.toml check   # WASM frontend
# Checks: advisories (RustSec) + license compliance + bans + source allowlist.

[graph]
# Resolve dependencies for every target so platform-specific crates
# (windows / macos / linux) are all covered by the checks.
all-features = false

[advisories]
version = 2
yanked = "deny"
# Accepted, non-fixable advisories — each needs a documented reason.
ignore = [
    # Build-time proc-macros pulled transitively by Leptos: compile-time only,
    # NOT shipped in the WASM, not vulnerabilities. See security-assessment.md.
    { id = "RUSTSEC-2024-0436", reason = "paste — unmaintained; build-time proc-macro via Leptos" },
    { id = "RUSTSEC-2026-0173", reason = "proc-macro-error2 — unmaintained; build-time proc-macro via Leptos" },
    # Existing desktop/setup assessment: Tauri -> urlpattern -> unic 0.9.0.
    # These five RustSec notices are informational="unmaintained", with no
    # patched unic release. They are already recorded in the v2.9.13 Windows
    # shipping assessment. Retain that explicit maintenance-risk acceptance;
    # revisit when Tauri/urlpattern removes this dependency. cargo audit and
    # OSV continue to report them. No vulnerability or yanked-version exception.
    { id = "RUSTSEC-2025-0081", reason = "unic-char-property 0.9.0 — maintenance-only notice, no patched release; Tauri/urlpattern; existing v2.9.13 shipping assessment" },
    { id = "RUSTSEC-2025-0075", reason = "unic-char-range 0.9.0 — maintenance-only notice, no patched release; Tauri/urlpattern; existing v2.9.13 shipping assessment" },
    { id = "RUSTSEC-2025-0080", reason = "unic-common 0.9.0 — maintenance-only notice, no patched release; Tauri/urlpattern; existing v2.9.13 shipping assessment" },
    { id = "RUSTSEC-2025-0100", reason = "unic-ucd-ident 0.9.0 — maintenance-only notice, no patched release; Tauri/urlpattern; existing v2.9.13 shipping assessment" },
    { id = "RUSTSEC-2025-0098", reason = "unic-ucd-version 0.9.0 — maintenance-only notice, no patched release; Tauri/urlpattern; existing v2.9.13 shipping assessment" },
]

[licenses]
version = 2
# Permissive licenses compatible with redistributing an MIT binary.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "BSL-1.0",         # Boost Software License — permissive, MIT-compatible
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "MPL-2.0",
    "CC0-1.0",
    "0BSD",
    # Mozilla's CA root bundle (`webpki-root-certs`), pulled in by reqwest 0.13's
    # platform verifier. Data, not code, under a permissive Linux Foundation
    # licence with no copyleft — compatible with shipping XOKSA under MIT.
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9
# Per-crate clarifications / exceptions are added here if a crate's license
# metadata is non-SPDX or needs a documented allowance.
exceptions = []

[bans]
# A copy-left or duplicate blow-up should be visible, not silently accepted.
multiple-versions = "warn"
wildcards = "warn"

[sources]
# Only crates.io and no ad-hoc git dependencies.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# The one git source: calamine, pinned to a full commit by [patch.crates-io] in
# Cargo.toml until a calamine release accepts zip 9. Remove with that section.
allow-git = ["https://github.com/tafia/calamine"]
