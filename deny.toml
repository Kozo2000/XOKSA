# cargo-deny — supply-chain gate for the shipped binary.
#   cargo deny check                                        # native workspace
#   cargo deny --manifest-path webui-leptos/Cargo.toml --config deny.toml check   # WASM frontend
# Checks: advisories (RustSec) + license compliance + bans + source allowlist.

[graph]
# Resolve dependencies for every target so platform-specific crates
# (windows / macos / linux) are all covered by the checks.
all-features = false

[advisories]
version = 2
yanked = "deny"
# Accepted, non-fixable advisories — each needs a documented reason.
ignore = [
    # Build-time proc-macros pulled transitively by Leptos: compile-time only,
    # NOT shipped in the WASM, not vulnerabilities. See security-assessment.md.
    "RUSTSEC-2024-0436", # paste — unmaintained
    "RUSTSEC-2026-0173", # proc-macro-error2 — unmaintained
]

[licenses]
version = 2
# Permissive licenses compatible with redistributing an MIT binary.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "BSL-1.0",         # Boost Software License — permissive, MIT-compatible
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "MPL-2.0",
    "CC0-1.0",
    "0BSD",
    # Mozilla's CA root bundle (`webpki-root-certs`), pulled in by reqwest 0.13's
    # platform verifier. Data, not code, under a permissive Linux Foundation
    # licence with no copyleft — compatible with shipping XOKSA under MIT.
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9
# Per-crate clarifications / exceptions are added here if a crate's license
# metadata is non-SPDX or needs a documented allowance.
exceptions = []

[bans]
# A copy-left or duplicate blow-up should be visible, not silently accepted.
multiple-versions = "warn"
wildcards = "warn"

[sources]
# Only crates.io and no ad-hoc git dependencies.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
