# cargo-deny — supply-chain gate for the shipped binary.
#   cargo deny check                                        # native workspace
#   cargo deny --manifest-path webui-leptos/Cargo.toml --config deny.toml check   # WASM frontend
# Checks: advisories (RustSec) + license compliance + bans + source allowlist.

[graph]
# Resolve dependencies for every target so platform-specific crates
# (windows / macos / linux) are all covered by the checks.
all-features = false

[advisories]
version = 2
yanked = "deny"
# Accepted, non-fixable advisories — each needs a documented reason.
ignore = [
    # Build-time proc-macros pulled transitively by Leptos: compile-time only,
    # NOT shipped in the WASM, not vulnerabilities. See security-assessment.md.
    { id = "RUSTSEC-2024-0436", reason = "paste — unmaintained; build-time proc-macro via Leptos" },
    { id = "RUSTSEC-2026-0173", reason = "proc-macro-error2 — unmaintained; build-time proc-macro via Leptos" },
    # Yanked: every zip 8.x release was yanked from crates.io (found 2026-10-16),
    # and calamine 0.36.1 — the latest, read by the spreadsheet import — requires
    # zip ^8.6; no calamine release uses zip 9 yet. The existing lockfile keeps
    # building. Remove this entry when calamine moves to zip 9.
    { crate = "zip@8.6.0", reason = "all zip 8.x yanked; calamine 0.36.1 requires ^8.6 (2026-10-16)" },
    # The advisories behind that yank, found 2026-10-17. All three are in
    # extracting an archive to the filesystem (`ZipArchive::extract`,
    # `ZipStreamReader::extract`). XOKSA does not use zip directly, and calamine
    # opens the workbook with `ZipArchive::new` and reads entries in memory — it
    # never calls `extract` — so the flaws are not reachable in the shipped
    # engine. The fix is zip >= 9.0.0, which calamine does not accept yet.
    # Remove these three with the yanked entry above. The same three are ignored
    # for `cargo audit` in ci.yml, audit.yml and scripts/check.sh.
    { id = "RUSTSEC-2026-0367", reason = "zip extract keeps SUID/SGID; extract is never called (calamine reads in memory)" },
    { id = "RUSTSEC-2026-0368", reason = "zip extract symlink escape; extract is never called (calamine reads in memory)" },
    { id = "RUSTSEC-2026-0369", reason = "zip extract permissions through symlinks; extract is never called (calamine reads in memory)" },
]

[licenses]
version = 2
# Permissive licenses compatible with redistributing an MIT binary.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "BSL-1.0",         # Boost Software License — permissive, MIT-compatible
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "MPL-2.0",
    "CC0-1.0",
    "0BSD",
    # Mozilla's CA root bundle (`webpki-root-certs`), pulled in by reqwest 0.13's
    # platform verifier. Data, not code, under a permissive Linux Foundation
    # licence with no copyleft — compatible with shipping XOKSA under MIT.
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9
# Per-crate clarifications / exceptions are added here if a crate's license
# metadata is non-SPDX or needs a documented allowance.
exceptions = []

[bans]
# A copy-left or duplicate blow-up should be visible, not silently accepted.
multiple-versions = "warn"
wildcards = "warn"

[sources]
# Only crates.io and no ad-hoc git dependencies.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
