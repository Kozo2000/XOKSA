name: Package signed installer (Windows)

# Called within the Windows release run. release-windows.yml compiles everything and
# leaves in its artifact the three executables as they sit inside the installer
# (to-sign/). Those are signed on the owner's machine — the key lives in Certum's
# cloud (SimplySign) and is unlocked with a one-time code from the owner's phone,
# so no runner can sign — and attached to a draft release. Environment approval
# resumes that same workflow run and packages the installer without compiling.
#
# It refuses unless every executable carries a valid signature, is the first
# run's executable once the signature is removed, and comes out of the finished
# MSI byte for byte. It does not sign the MSI and does not publish (§C.1).

on:
  workflow_call:
    inputs:
      artifact_name:
        description: "Unsigned artifact uploaded by the caller's build job"
        required: true
        type: string
      source_sha:
        description: "Commit built by the caller's build job"
        required: true
        type: string
      version:
        description: "Version built by the caller's build job"
        required: true
        type: string
      release_tag:
        description: "Draft release holding the signed executables"
        required: true
        type: string

permissions:
  contents: read  # checkout; the draft release is read by fetch-signed alone
  actions: read   # the first run's artifact

env:
  CARGO_TERM_COLOR: always
  # Same pin as release-windows.yml, so the packaging step is the same tool.
  TAURI_CLI_VERSION: "2.11.4"
  GH_TOKEN: ${{ github.token }}
  BUILD_RUN: ${{ github.run_id }}
  RELEASE_TAG: ${{ inputs.release_tag }}

jobs:
  # Draft releases are visible only to a token that can write to the repository
  # (measured 2026-10-16: with contents: read, `gh release download` answers
  # "release not found"). So this job alone holds contents: write, and it runs
  # no repository code: it downloads three files and hands them on as an artifact.
  fetch-signed:
    name: Fetch the signed executables
    runs-on: ubuntu-latest
    environment: windows-release-signing
    permissions:
      contents: write
      actions: read
    steps:
      # An absent/unprotected environment must not silently skip owner approval.
      - name: Gate — the owner approved this run
        shell: bash
        env:
          OWNER_ID: ${{ github.repository_owner_id }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/approvals" \
            --jq "any(.[]; .state == \"approved\" and (.user.id | tostring) == \"$OWNER_ID\" and any(.environments[]; .name == \"windows-release-signing\"))" \
            | grep -qx true \
            || { echo 'No owner approval for windows-release-signing on this run' >&2; exit 1; }

      - name: Fetch the signed executables from the draft release
        shell: bash
        run: |
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft | grep -qx true \
            || { echo 'The signing hand-off must be a draft release' >&2; exit 1; }
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern 'xoksa.exe' --pattern 'xoksa-setup.exe' --pattern 'xoksa-desktop.exe' --dir signed

      - name: Hand them to the packaging job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: signed-executables
          path: signed/*.exe
          if-no-files-found: error
          retention-days: 1

  package:
    name: Package the signed executables
    needs: fetch-signed
    runs-on: windows-latest
    permissions:
      contents: read
      actions: read

    steps:
      # Into RUNNER_TEMP, so the checkout below cannot clean it away.
      - name: Fetch this run's unsigned artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.artifact_name }}
          path: ${{ runner.temp }}/build

      - name: Verify the build manifest
        id: src
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.source_sha }}
          EXPECTED_VERSION: ${{ inputs.version }}
        run: |
          cd "$RUNNER_TEMP/build"
          test -f SHA256SUMS || { echo 'Missing build manifest' >&2; exit 1; }
          sha="$(sed -n 's/^# commit //p' SHA256SUMS)"
          version="$(sed -n 's/^# XOKSA \([^ ]*\) .*/\1/p' SHA256SUMS)"
          test "$sha" = "$EXPECTED_SHA" && test "$version" = "$EXPECTED_VERSION" \
            || { echo 'Manifest differs from the caller build' >&2; exit 1; }
          sha256sum -c SHA256SUMS
          echo "dir=$RUNNER_TEMP/build" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # Third-party actions are pinned to a commit SHA, as in release-windows.yml.
      - name: Checkout the commit the first run built
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.src.outputs.sha }}
          persist-credentials: false # no GITHUB_TOKEN left in .git/config

      - name: Read the pinned toolchain
        id: rust
        shell: bash
        run: echo "channel=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"

      - name: Install the pinned Rust toolchain
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: ${{ steps.rust.outputs.channel }}

      - name: Cache tauri-cli
        id: tools-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-tauri.exe
          key: ${{ runner.os }}-tools-tauri${{ env.TAURI_CLI_VERSION }}

      - name: Install tauri-cli
        if: steps.tools-cache.outputs.cache-hit != 'true'
        shell: bash
        run: cargo install --locked tauri-cli@"$TAURI_CLI_VERSION"

      - name: Fetch the signed executables
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: signed-executables
          path: ${{ runner.temp }}/signed

      # Valid signature, and — with the signature removed and the PE checksum
      # (which signtool rewrites) zeroed — identical to what the first run built.
      - name: Gate — signed, and the first run's executables
        shell: bash
        env:
          UNSIGNED: ${{ steps.src.outputs.dir }}/to-sign
        run: |
          st="$(ls "/c/Program Files (x86)/Windows Kits/10/bin/"*/x64/signtool.exe | sort -V | tail -1)"
          for f in xoksa.exe xoksa-setup.exe xoksa-desktop.exe; do
            "$st" verify //pa "$RUNNER_TEMP/signed/$f"
            cp "$RUNNER_TEMP/signed/$f" "$RUNNER_TEMP/stripped-$f"
            "$st" remove //s "$RUNNER_TEMP/stripped-$f"
            python - "$RUNNER_TEMP/stripped-$f" "$UNSIGNED/$f" <<'PY'
          import sys
          def body(p):
              b = bytearray(open(p, "rb").read())
              o = int.from_bytes(b[0x3c:0x40], "little") + 0x58   # OptionalHeader.CheckSum
              b[o:o + 4] = b"\0\0\0\0"
              return bytes(b)
          a, u = sys.argv[1:3]
          if body(a) != body(u):
              sys.exit(f"{u}: the signed file is not this run's executable")
          PY
          done

      - name: Stage the signed executables
        shell: bash
        run: |
          triple="$(rustc -vV | sed -n 's/^host: //p')"
          mkdir -p xoksa-desktop/binaries xoksa-desktop/target/release
          cp "$RUNNER_TEMP/signed/xoksa.exe"         "xoksa-desktop/binaries/xoksa-$triple.exe"
          cp "$RUNNER_TEMP/signed/xoksa-setup.exe"   "xoksa-desktop/binaries/xoksa-setup-$triple.exe"
          cp "$RUNNER_TEMP/signed/xoksa-desktop.exe" xoksa-desktop/target/release/xoksa-desktop.exe

      - name: Package the installer (no compilation)
        shell: bash
        working-directory: xoksa-desktop
        run: cargo tauri bundle --bundles msi

      - name: Collect the installer
        shell: bash
        env:
          XOKSA_VERSION: ${{ steps.src.outputs.version }}
        run: |
          msi="$(find xoksa-desktop/target/release/bundle/msi -name '*.msi' | head -1)"
          test -n "$msi" || { echo "no MSI produced" >&2; exit 1; }
          mkdir -p target/release
          mv "$msi" "target/release/XOKSA-${XOKSA_VERSION}-x64.msi"
          echo "XOKSA_VERSION=$XOKSA_VERSION" >> "$GITHUB_ENV"

      - name: Gate — the installer carries the signed executables unchanged
        shell: pwsh
        run: |
          $msi = (Resolve-Path "target/release/XOKSA-$env:XOKSA_VERSION-x64.msi").Path
          $out = Join-Path $env:RUNNER_TEMP 'packaged'
          $p = Start-Process msiexec.exe -ArgumentList @('/a', "`"$msi`"", '/qn', "TARGETDIR=`"$out`"") -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "msiexec /a exited $($p.ExitCode)" }
          foreach ($f in 'xoksa.exe', 'xoksa-setup.exe', 'xoksa-desktop.exe') {
            $a = (Get-FileHash (Join-Path $out "PFiles/XOKSA/$f")).Hash
            $b = (Get-FileHash (Join-Path $env:RUNNER_TEMP "signed/$f")).Hash
            if ($a -ne $b) { throw "$f inside the MSI is not the signed file" }
          }

      - name: Gate — no identifying build path in the installer
        shell: bash
        run: bash scripts/check-no-host-paths.sh "target/release/XOKSA-${XOKSA_VERSION}-x64.msi"

      - name: Hash the installer
        shell: bash
        run: |
          {
            echo "# XOKSA ${XOKSA_VERSION} Windows x86_64 — installer packaged from signed executables (MSI itself unsigned)"
            echo "# commit $(git rev-parse HEAD)"
            echo "# built by run ${BUILD_RUN}; executables from release ${RELEASE_TAG}; packaged by run ${{ github.run_id }}"
            echo
            sha256sum "target/release/XOKSA-${XOKSA_VERSION}-x64.msi" "$RUNNER_TEMP"/signed/*.exe
          } | tee SHA256SUMS

      - name: Upload the installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: xoksa-${{ env.XOKSA_VERSION }}-windows-x86_64-packaged
          if-no-files-found: error
          retention-days: 30
          path: |
            target/release/XOKSA-${{ env.XOKSA_VERSION }}-x64.msi
            SHA256SUMS
