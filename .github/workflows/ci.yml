name: CI

# One entry point and one run. Checks and builds use the triggering commit.
on:
  push:
    branches: [ 'main' ]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'build.rs'
      - 'webui-leptos/**'
      - 'xoksa-desktop/**'
      - 'xoksa-setup/**'
      - 'xoksa-paths/**'
      - '**/Cargo.toml'
      - '**/Cargo.lock'
      - 'deny.toml'
      - 'rust-toolchain.toml'
      - 'scripts/**'
      - '.github/workflows/ci.yml'
      - '.github/workflows/release-macos.yml'
      - '.github/workflows/release-windows.yml'
      - '.github/workflows/release-windows-package.yml'
      - '!**/*.md'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  macos:
    name: macOS
    uses: ./.github/workflows/release-macos.yml
    with:
      source_sha: ${{ github.sha }}
    permissions:
      contents: read

  windows:
    name: Windows
    uses: ./.github/workflows/release-windows.yml
    with:
      source_sha: ${{ github.sha }}
    permissions:
      contents: write # passed down only to the owner-gated signing hand-off
      actions: read
